[project]
name = "iot-api-tests"
version = "0.1.0"
description = "9220 HTTP and WebSocket business interface tests"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "websockets>=15,<18",
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["stability: local framework fault and lifecycle tests"]
filterwarnings = ["error"]

